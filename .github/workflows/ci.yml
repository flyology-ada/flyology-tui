name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flyology-tui-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  behavioral-tests:
    name: Behavioral tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - macos-15
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=16.1.0
            gprbuild=26.0.1
          cache: true
      - name: Select toolchain
        run: |
          alr --non-interactive toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
      - name: Run behavioral suite
        run: ./scripts/test.sh
